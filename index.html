<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="输入 2FA 密钥，在浏览器本地生成动态验证码。"><meta name="referrer" content="no-referrer"><title>2FA 验证码</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23233430'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='28' fill='white'%3E2F%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="theme.css"></head>
<body><main><header><span class="brand">2FA</span><span class="local">本地生成 · 无需登录</span></header><h1>动态验证码</h1><p class="subtitle">输入密钥，即可生成并自动更新验证码。</p><section class="card"><form id="form"><div class="field-title"><label for="secret">2FA 密钥</label><button type="button" class="text-btn" id="clear">清空</button></div><div class="secret-wrap"><textarea id="secret" class="hide-secret" spellcheck="false" autocomplete="off" autocapitalize="off" aria-describedby="hint error" placeholder="输入密钥或 otpauth:// 链接" required></textarea><button class="visibility" type="button" id="visibility" aria-label="显示密钥" title="显示密钥"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><p id="hint" class="hint">密钥仅在当前页面使用，不上传、不保存。</p><details><summary>高级设置</summary><div class="options"><div><label for="algorithm">算法</label><select id="algorithm"><option>SHA1</option><option>SHA256</option><option>SHA512</option></select></div><div><label for="digits">位数</label><select id="digits"><option value="6">6 位</option><option value="8">8 位</option></select></div><div><label for="period">周期（秒）</label><input id="period" type="number" value="30" min="1" max="300" required></div></div></details><button type="submit" class="primary">生成验证码</button><div class="error" id="error" role="alert"></div></form><section class="result" aria-label="动态验证码"><div class="result-heading"><span>当前验证码</span><span class="live" id="live"><i></i><span>等待密钥</span></span></div><div class="account" id="account">准备好进行下一次验证</div><div class="code" id="code" aria-label="尚未生成验证码">••• •••</div><button class="copy" id="copy" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg><span id="copy-label">复制验证码</span></button><div class="timer"><svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15"/><circle class="progress" id="progress" cx="18" cy="18" r="15"/></svg><span id="countdown">等待生成验证码</span><span id="period-label">30 秒 / 周期</span></div></section></section><footer>验证码无效？请检查密钥与参数，并开启设备时间自动同步。</footer></main><div id="toast" class="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
