<body>
<div class="atmosphere" aria-hidden="true"></div>
<div class="shell">
<div class="wordmark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3 7.5 3v5.5c0 4.6-4 7.8-7.5 9-3.5-1.2-7.5-4.4-7.5-9V6L12 3Z" stroke="currentColor" stroke-width="1.6"/><path d="m8.5 11.5 2.3 2.3 4.8-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>keylane</span></div>
<main>
<header><div class="header-top"><div class="app-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div><span class="local-badge"><i></i> 本地运行</span></div><h1>2FA 验证器</h1><p>输入密钥，即刻获取动态验证码。</p></header>
<div class="field-label"><label for="secret">验证密钥</label><span>BASE32</span></div>
<div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="8" cy="9" r="4" stroke="currentColor" stroke-width="1.6"/><path d="m11 12 8 8m-3-3 2-2m-5-1 2-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input id="secret" type="password" autocomplete="off" spellcheck="false" autocapitalize="characters" placeholder="输入或粘贴你的密钥" aria-describedby="error"><button id="reveal" aria-label="显示密钥" aria-pressed="false" type="button">显示</button></div>
<p id="error" role="status" class="hint">支持 Base32 密钥，自动忽略空格。</p>
<label class="remember"><span class="remember-copy">记住上次密钥<small id="saved-state" aria-live="polite">下次打开，自动恢复密钥</small></span><input id="remember" type="checkbox" checked><span class="toggle" aria-hidden="true"></span></label>
<section id="output" class="output" data-state="empty" aria-label="动态验证码">
<div class="output-heading"><span>动态验证码</span><span id="badge" class="badge" role="status">等待密钥</span></div>
<div id="code" class="code" aria-label="当前验证码">··· ···</div>
<div class="timer"><svg viewBox="0 0 36 36" aria-hidden="true"><circle class="track" cx="18" cy="18" r="15"/><circle id="ring" cx="18" cy="18" r="15"/></svg><span id="countdown">输入密钥后自动生成</span></div>
<div class="progress-track" aria-hidden="true"><div id="progress"></div></div>
</section>
<div class="actions"><button id="copy" disabled type="button"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M15 5V4a1 1 0 0 0-1-1H5a2 2 0 0 0-2 2v9a1 1 0 0 0 1 1h1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span id="copy-label">复制验证码</span></button><button id="clear" type="button"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M9 6V4h6v2M6 6l1 14h10l1-14m-8 4v6m4-6v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>清空</button></div>
<footer><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3 7 3v5c0 4-3.4 7.2-7 9-3.6-1.8-7-5-7-9V6l7-3Z" stroke="currentColor" stroke-width="1.6"/><path d="m9 11 2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>密钥仅保存在此浏览器，不会上传</footer>
</main>
<p class="bottom-note">PRIVATE BY DESIGN</p>
</div>
<div id="toast" role="status"></div>
<script type="module">function decodeSecret(value){const s=value.toUpperCase().replace(/\s/g,'').replace(/=+$/,'');if(!/^[A-Z2-7]+$/.test(s)||![0,2,4,5,7].includes(s.length%8))throw Error('请输入有效的 Base32 密钥（字母 A–Z、数字 2–7）。');let bits=0,acc=0;const out=[];for(const c of s){acc=(acc<<5)|'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'.indexOf(c);bits+=5;if(bits>=8){bits-=8;out.push((acc>>bits)&255);acc&=(1<<bits)-1;}}if(acc!==0||out.length===0)throw Error('密钥格式不完整，请检查后重试。');return new Uint8Array(out);}
async function totp(secret,time=Date.now(),digits=6){const key=await crypto.subtle.importKey('raw',decodeSecret(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);const counter=new ArrayBuffer(8);new DataView(counter).setBigUint64(0,BigInt(Math.floor(time/30000)));const mac=new Uint8Array(await crypto.subtle.sign('HMAC',key,counter));const o=mac[mac.length-1]&15;const n=((mac[o]&127)<<24)|(mac[o+1]<<16)|(mac[o+2]<<8)|mac[o+3];return String(n%10**digits).padStart(digits,'0');}



const $ = id => document.getElementById(id);
const secret = $('secret');
const remember = $('remember');
const KEY = 'keylane.secret';
const PREF = 'keylane.remember';
const hint = '支持 Base32 密钥，自动忽略空格。';
let version = 0, current = '', currentStep = -1, requestedStep = -1;
let toastTimer, inputTimer, copiedTimer;

function toast(message) {
  $('toast').textContent = message;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2600);
}
function storageStatus(text, failed = false) {
  $('saved-state').textContent = text;
  $('saved-state').classList.toggle('storage-error', failed);
}
function persist(valid = false) {
  try {
    localStorage.setItem(PREF, String(remember.checked));
    if (!remember.checked || !secret.value.trim()) {
      localStorage.removeItem(KEY);
      storageStatus(remember.checked ? '下次打开，自动恢复密钥' : '仅在本次页面中使用');
    } else if (valid) {
      localStorage.setItem(KEY, secret.value.toUpperCase().replace(/\s/g, ''));
      storageStatus('已保存在此浏览器');
    }
    return true;
  } catch {
    storageStatus('浏览器存储不可用，请勿依赖自动保存', true);
    return false;
  }
}
function clearCopyFeedback() {
  clearTimeout(copiedTimer);
  $('copy-label').textContent = '复制验证码';
  $('copy').classList.remove('copied');
}
function reset() {
  current = '';
  currentStep = -1;
  $('code').textContent = '··· ···';
  $('copy').disabled = true;
  $('badge').textContent = '等待密钥';
  $('countdown').textContent = '输入密钥后自动生成';
  $('ring').style.strokeDashoffset = '94.25';
  $('progress').style.transform = 'scaleX(0)';
  $('output').dataset.state = 'empty';
  $('output').classList.remove('expiring');
  clearCopyFeedback();
}
function hideSecret() {
  secret.type = 'password';
  $('reveal').textContent = '显示';
  $('reveal').setAttribute('aria-label', '显示密钥');
  $('reveal').setAttribute('aria-pressed', 'false');
}
function showError(message) {
  reset();
  $('error').textContent = message;
  $('error').className = 'hint error';
  secret.setAttribute('aria-invalid', 'true');
  $('badge').textContent = '检查密钥';
  $('output').dataset.state = 'error';
}
async function update({ save = false } = {}) {
  const revision = ++version;
  const value = secret.value;
  const time = Date.now();
  const step = Math.floor(time / 30000);
  requestedStep = step;
  if (!value.trim()) { reset(); return; }
  try {
    if (!globalThis.crypto?.subtle) throw Error('当前浏览器不支持生成验证码，请使用新版浏览器打开。');
    const code = await totp(value, time);
    if (revision !== version) return;
    if (Math.floor(Date.now() / 30000) !== step) { return update({ save }); }
    if (current && current !== code) clearCopyFeedback();
    current = code;
    currentStep = step;
    $('code').textContent = code.slice(0, 3) + ' ' + code.slice(3);
    $('copy').disabled = false;
    $('badge').textContent = '实时更新';
    $('output').dataset.state = 'ready';
    $('error').textContent = hint;
    $('error').className = 'hint';
    secret.setAttribute('aria-invalid', 'false');
    if (save) persist(true);
    tick();
  } catch (error) {
    if (revision !== version) return;
    showError(error.message);
    if (save && remember.checked) storageStatus('格式有误，未覆盖之前保存的密钥');
  }
}
function tick() {
  if (!current) return;
  const step = Math.floor(Date.now() / 30000);
  if (step !== currentStep) {
    // A stale code is never presented as usable during an async refresh.
    $('copy').disabled = true;
    $('badge').textContent = '正在更新';
    if (step !== requestedStep) update();
    return;
  }
  const left = 30 - Math.floor(Date.now() / 1000) % 30;
  $('countdown').textContent = left <= 5 ? left + ' 秒后更新，请及时使用' : left + ' 秒后更新';
  $('ring').style.strokeDashoffset = String(94.25 * (1 - left / 30));
  $('progress').style.transform = 'scaleX(' + left / 30 + ')';
  $('output').classList.toggle('expiring', left <= 5);
}
function legacyCopy(text) {
  const field = document.createElement('textarea');
  field.value = text;
  field.setAttribute('readonly', '');
  field.style.cssText = 'position:fixed;left:-9999px;top:0;font-size:16px';
  const previous = document.activeElement;
  document.body.appendChild(field);
  field.select();
  field.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); }
  finally { field.remove(); previous?.focus({ preventScroll: true }); }
  return ok;
}
async function writeClipboard(text) {
  try {
    if (!navigator.clipboard?.writeText) throw Error('Clipboard unavailable');
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    try { return legacyCopy(text); } catch { return false; }
  }
}
secret.addEventListener('input', () => {
  ++version;
  clearTimeout(inputTimer);
  reset();
  $('error').textContent = hint;
  $('error').className = 'hint';
  secret.setAttribute('aria-invalid', 'false');
  if (!secret.value.trim()) { persist(); return; }
  if (remember.checked) storageStatus('验证后自动保存');
  inputTimer = setTimeout(() => update({ save: true }), 220);
});
remember.addEventListener('change', () => {
  if (persist(!!current)) toast(remember.checked ? '已开启本地记忆' : '已关闭记忆，保存的密钥已移除');
});
$('reveal').onclick = () => {
  if (secret.type === 'text') { hideSecret(); return; }
  secret.type = 'text';
  $('reveal').textContent = '隐藏';
  $('reveal').setAttribute('aria-label', '隐藏密钥');
  $('reveal').setAttribute('aria-pressed', 'true');
};
$('clear').onclick = () => {
  ++version;
  clearTimeout(inputTimer);
  secret.value = '';
  reset();
  hideSecret();
  $('error').textContent = hint;
  $('error').className = 'hint';
  secret.setAttribute('aria-invalid', 'false');
  const removed = persist();
  toast(removed ? '密钥与本地记录已清空' : '页面已清空，但无法删除浏览器记录');
  secret.focus();
};
$('copy').onclick = async () => {
  if (!current || $('copy').disabled) return;
  const revision = version;
  const copiedCode = current;
  const copiedStep = currentStep;
  if (Math.floor(Date.now() / 30000) !== copiedStep) { await update(); toast('验证码已更新，请重新复制'); return; }
  const ok = await writeClipboard(copiedCode);
  if (revision !== version) return;
  if (!ok) { toast('无法自动复制，请长按或选中验证码复制'); return; }
  if (Math.floor(Date.now() / 30000) !== copiedStep) { toast('刚复制的验证码已到期，请复制新验证码'); return; }
  clearCopyFeedback();
  $('copy-label').textContent = '已复制';
  $('copy').classList.add('copied');
  toast('验证码已复制');
  copiedTimer = setTimeout(clearCopyFeedback, 2200);
};
try {
  remember.checked = localStorage.getItem(PREF) !== 'false';
  if (remember.checked) secret.value = localStorage.getItem(KEY) || '';
  storageStatus(secret.value ? '已恢复上次的密钥' : remember.checked ? '下次打开，自动恢复密钥' : '仅在本次页面中使用');
} catch { storageStatus('浏览器存储不可用，请勿依赖自动保存', true); }
update();
setInterval(tick, 250);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hideSecret();
  else { clearTimeout(inputTimer); update({ save: true }); }
});
</script>
</body>
</html>
