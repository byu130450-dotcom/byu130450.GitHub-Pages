<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Keyroom · 2FA 验证码</title><link rel="stylesheet" href="style.css"></head><body><main><div class="heading"><div class="app-icon"><svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="11" rx="4"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div><h1>2FA 验证码</h1><p>粘贴密钥，即刻验证。</p></div><section class="glass"><form id="form"><label for="secret">你的密钥</label><div class="secret-wrap"><input id="secret" type="password" placeholder="密钥或 otpauth:// 链接" autocomplete="off" spellcheck="false" required><button id="show" type="button" aria-label="显示密钥">显示</button></div><details><summary>更多设置</summary><div class="settings"><label>算法<select id="algorithm"><option>SHA-1</option><option>SHA-256</option><option>SHA-512</option></select></label><label>位数<select id="digits"><option>6</option><option>8</option></select></label><label>周期<select id="period"><option value="30">30 秒</option><option value="60">60 秒</option></select></label></div></details><label class="remember"><input id="remember" type="checkbox" checked>记住上次密钥<span id="save-status" aria-live="polite">仅存于此浏览器</span></label><p id="error" role="alert"></p><button class="primary" type="submit">生成验证码</button></form><div class="result"><div class="result-head"><span>动态验证码</span><span id="status">等待密钥</span></div><div id="account" class="account">TIME-BASED ONE-TIME PASSWORD</div><div id="code" aria-label="当前验证码">••• •••</div><div class="timer"><span id="timer-label">输入密钥后自动更新</span><span id="seconds">— 秒</span></div><div class="track"><div id="bar"></div></div><button id="copy" disabled>复制验证码</button><div class="bottom"><span id="config">TOTP · 6 位 · 30 秒</span><button id="clear" type="button">清除</button></div></div></section><p class="privacy">本地计算 · 不上传 · 清除按钮可删除已存密钥</p><button id="demo" class="demo" type="button">试用演示</button></main><div id="toast" role="status"></div><script src="app.js"></script></body></html>
